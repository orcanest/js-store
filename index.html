<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A small JavaScript project for fetching and displaying products from a fake API.">
  <title>Store</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <div>
        <p class="eyebrow">JavaScript Project</p>
        <h1>Store</h1>
      </div>
      <span class="tech-badge">Vanilla JavaScript</span>
    </div>
  </header>

  <main class="container">
    <section class="toolbar" aria-label="search products">
      <label class="search-label" for="search-input">search products</label>
      <input
        id="search-input"
        type="search"
        placeholder="product name"
        autocomplete="off"
      >
    </section>

    <section class="status-area" aria-live="polite">
      <p id="status-message" class="status-message">loading products</p>
      <button id="retry-button" class="button button-secondary hidden" type="button">
        Trying ...
      </button>
    </section>

    <section id="products-grid" class="products-grid" aria-label="products-list"></section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Made by Try</p>
    </div>
  </footer>
</body>
</html>
